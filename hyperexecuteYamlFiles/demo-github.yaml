---
version: "0.1"
globalTimeout: 90
testSuiteTimeout: 90
testSuiteStep: 90

runson: linux
autosplit: true
concurrency: 1

# Code is fetched from Repo 1. This repo holds YAML only (no pom.xml).
# differentialUpload is deliberately NOT set.
sourcePayload:
  platform: git
  link: https://github.com/vishnuknairTestMuAI/he-demo-source.git
  ref: main
  accessToken: ${{ .secrets.GIT_PAT }}

pre:
  # Diagnostic: shows which repo was actually cloned on the VM.
  # Expect pom.xml + src/ from he-demo-source. Seeing hyperexecuteYamlFiles/ means the YAML repo was cloned instead.
  - pwd && ls -la
  - mvn -Dmaven.test.skip=true clean install

testDiscovery:
  type: raw
  mode: dynamic
  command: grep -rl '@Test' src/test/java | sed 's|.*/||; s|\.java$||'

testRunnerCommand: mvn test -Dtest=$test

jobLabel: [sourcePayload-demo, github]

uploadArtefacts:
  - name: surefire-reports
    path:
      - target/surefire-reports/**
