---
version: "0.1"
globalTimeout: 90
testSuiteTimeout: 90
testSuiteStep: 90

runson: linux
autosplit: true
concurrency: 1

# Option 1: no sourcePayload. The project clones this YAML repo, then the pre step clones the code repo itself.
pre:
  - pwd && ls -la
  # The token is in the URL: check the job logs to confirm it is masked.
  - git clone --depth 1 -b main https://x-access-token:${{ .secrets.GIT_PAT }}@github.com/vishnuknairTestMuAI/he-demo-source.git code
  - ls -la code
  - cd code && mvn -Dmaven.test.skip=true clean install

# Discovery looks inside code/. If discovery runs before pre, this finds nothing.
testDiscovery:
  type: raw
  mode: dynamic
  command: grep -rl '@Test' code/src/test/java | sed 's|.*/||; s|\.java$||'

testRunnerCommand: cd code && mvn test -Dtest=$test

jobLabel: [option1-preclone]

uploadArtefacts:
  - name: surefire-reports
    path:
      - code/target/surefire-reports/**
